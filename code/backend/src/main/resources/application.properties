spring.application.name=backend
server.port=${PORT:8080}
spring.docker.compose.enabled=false

# Configuracoes de banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/studentcoin
spring.datasource.username=root
spring.datasource.password=1234

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


# Definicao de profile ativo, modo dev (modo producao ativado via action)
spring.profiles.active=dev
# Prefixo de endpoint para padronizacao
spring.mvc.servlet.path=/api

# JWT
jwt.secret=${JWT_SECRET:2abd88b37704ecf84f2457d64a25c60e}
jwt.cookie-name=jwt
jwt.refresh-cookie-name=refresh



