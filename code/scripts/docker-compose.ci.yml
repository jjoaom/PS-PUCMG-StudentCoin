services:

  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped
    env_file:
      - ../db/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: springboot-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgres://postgres:3306/animongs_db
      SPRING_DATASOURCE_USERNAME: ci_user
      SPRING_DATASOURCE_PASSWORD: ci_password
      SPRING_PROFILES_ACTIVE: ci
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: vite_prod
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - backend-net

volumes:
  postgres-data:
    driver: local

networks:
  backend-net:
    driver: bridge