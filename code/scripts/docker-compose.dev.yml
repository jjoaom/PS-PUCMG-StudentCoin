# ============================================================
# DOCKER COMPOSE — AMBIENTE DE DESENVOLVIMENTO LOCAL
# NÃO UTILIZAR EM PRODUÇÃO
# ============================================================

services:

  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped
    env_file:
      - ../db/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: DXuuT5bLZLupYK3jBW0
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"  # UI web para inspecionar emails
      - "1025:1025"  # SMTP que o backend vai usar
    networks:
      - backend-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: springboot-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
      - ../backend/.env.dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-net

  frontend:
    build:
      context: ../frontend
    container_name: vite_dev
    working_dir: /app
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=false
    depends_on:
      - backend
    networks:
      - backend-net

volumes:
  postgres-data:
    driver: local
  rabbitmq-data:
    driver: local

networks:
  backend-net:
    driver: bridge